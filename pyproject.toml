[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quilt-canon-witness"
version = "0.1.0"
description = "Cryptographic witness log — append-only ledger for canon events"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "SuperInstance"}]
keywords = ["witness", "ledger", "cryptographic", "chain", "canon", "quilt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.scripts]
quilt-canon-witness = "quilt_canon_witness.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["quilt_canon_witness*"]
